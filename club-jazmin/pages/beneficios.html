<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beneficios — Club Jazmín</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --grafito: #1c1c1c;
      --vison: #6a645f;
      --tiza: #f1ebe6;
      --rosa: #df9fb1;
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body: 'DM Sans', system-ui, sans-serif;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    html { font-size: 16px; scroll-behavior: smooth; }
    body { font-family: var(--font-body); background: #1c1c1c; color: #f1ebe6; -webkit-font-smoothing: antialiased; min-height: 100vh; }
    /* NAV */
    .nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: #1c1c1c; padding: 18px 40px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(241,235,230,0.08); }
    .nav-logo { font-family: var(--font-body); font-size: 11px; font-weight: 500; letter-spacing: 0.22em; color: #f1ebe6; text-decoration: none; text-transform: uppercase; }
    .nav-logo em { color: #df9fb1; font-style: normal; }
    .nav-links { display: flex; gap: 32px; list-style: none; }
    .nav-links a { font-size: 11px; letter-spacing: 0.12em; color: #6a645f; text-decoration: none; text-transform: uppercase; transition: color var(--transition); }
    .nav-links a:hover { color: #f1ebe6; }
    .nav-hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; background: none; border: none; padding: 4px; }
    .nav-hamburger span { display: block; width: 22px; height: 1px; background: #f1ebe6; }
    .nav-mobile { display: none; position: fixed; inset: 0; background: #1c1c1c; z-index: 99; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
    .nav-mobile.open { display: flex; }
    .nav-mobile a { font-family: var(--font-display); font-size: 32px; font-weight: 300; color: #f1ebe6; text-decoration: none; }
    .nav-mobile a:hover { color: #df9fb1; }
    .nav-mobile-close { position: absolute; top: 20px; right: 28px; background: none; border: none; color: #6a645f; font-size: 24px; cursor: pointer; }
    /* MAIN */
    .pag { padding: 120px 40px 80px; max-width: 1100px; margin: 0 auto; }
    .eyebrow { font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; color: #df9fb1; margin-bottom: 12px; }
    .page-title { font-family: var(--font-display); font-size: clamp(32px, 5vw, 52px); font-weight: 600; color: #f1ebe6; margin-bottom: 8px; line-height: 1.1; }
    .page-sub { font-size: 14px; font-weight: 300; color: #6a645f; margin-bottom: 40px; }
    /* FILTROS */
    .filtros { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 32px; }
    .filtro-btn { font-family: var(--font-body); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; background: transparent; border: 1px solid #3a3a3a; color: #6a645f; border-radius: 20px; padding: 8px 18px; cursor: pointer; transition: var(--transition); }
    .filtro-btn:hover, .filtro-btn.active { border-color: #df9fb1; color: #f1ebe6; background: rgba(223,159,177,0.12); }
    /* GRID */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .card { background: #232323; border: 0.5px solid #3a3a3a; border-radius: 12px; padding: 28px 24px; display: flex; flex-direction: column; gap: 8px; transition: var(--transition); }
    .card:hover { transform: translateY(-3px); box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
    .card-tipo { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: #df9fb1; font-weight: 500; }
    .card-nombre { font-family: var(--font-display); font-size: 20px; font-weight: 600; color: #f1ebe6; line-height: 1.2; }
    .card-desc { font-size: 13px; font-weight: 300; color: #6a645f; line-height: 1.6; flex: 1; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding-top: 16px; border-top: 0.5px solid #3a3a3a; }
    .pts-num { font-family: var(--font-display); font-size: 28px; font-weight: 300; color: #f1ebe6; line-height: 1; }
    .pts-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #6a645f; margin-top: 2px; }
    .btn-canjear { font-family: var(--font-body); font-size: 10px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; background: #df9fb1; color: #1c1c1c; border: none; border-radius: 2px; padding: 12px 24px; cursor: pointer; transition: var(--transition); }
    .btn-canjear:hover { background: #e8b5c8; transform: translateY(-1px); }
    .estado { grid-column: 1 / -1; text-align: center; padding: 60px 0; font-size: 13px; font-weight: 300; color: #6a645f; }
    /* FOOTER */
    footer { background: #1c1c1c; padding: 32px 40px; text-align: center; border-top: 1px solid rgba(241,235,230,0.06); margin-top: 40px; }
