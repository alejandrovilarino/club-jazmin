<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beneficios — Club Jazmín</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    .beneficios-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
    .beneficio-card { background: var(--color-surface, #1e1e1e); border: 1px solid var(--color-border, #2a2a2a); border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .beneficio-tipo { font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--color-accent, #df9fb1); font-weight: 500; }
    .beneficio-nombre { font-family: Georgia, serif; font-size: 1.1rem; color: var(--color-text, #f1ebe6); line-height: 1.3; }
    .beneficio-desc { font-size: 0.85rem; color: var(--color-muted, #6a645f); line-height: 1.5; flex: 1; }
    .beneficio-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 0.5rem; border-top: 1px solid var(--color-border, #2a2a2a); padding-top: 1rem; }
    .beneficio-puntos { font-family: Georgia, serif; font-size: 1.4rem; color: var(--color-text, #f1ebe6); }
    .beneficio-puntos span { font-size: 0.75rem; color: var(--color-muted, #6a645f); display: block; }
    .beneficio-btn { background: var(--color-accent, #df9fb1); color: #1c1c1c; border: none; border-radius: 6px; padding: 0.5rem 1rem; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; }
    .filtros { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .filtro-btn { background: transparent; border: 1px solid var(--color-border, #2a2a2a); color: var(--color-muted, #6a645f); border-radius: 20px; padding: 0.4rem 1rem; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; }
    .filtro-btn.active, .filtro-btn:hover { border-color: var(--color-accent, #df9fb1); color: var(--color-accent, #df9fb1); }
    .loading { text-align: center; color: var(--color-muted, #6a645f); padding: 3rem; }
    .header-section { margin-bottom: 0.5rem; }
    .header-section p { color: var(--color-muted, #6a645f); font-size: 0.9rem; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="../index.html" class="logo">CLUB <em>JAZMÍN</em> DE ROSAS</a>
    <button class="menu-toggle" id="menuToggle" aria-label="Menú">&#9776;</button>
    <nav class="site-nav" id="siteNav">
      <button class="menu-close" id="menuClose">&#10005;</button>
      <a href="../index.html">Inicio</a>
      <a href="perfil.html">Mi perfil</a>
      <a href="beneficios.html">Beneficios</a>
      <a href="skinbook.html">Skinbook</a>
    </nav>
  </header>

  <main class="container" style="padding-top: 6rem; max-width: 1100px; margin: 0 auto; padding-bottom: 4rem;">
    <div class="header-section">
      <p style="font-size:0.75rem; letter-spacing:0.15em; text-transform:uppercase; color: var(--color-accent,#df9fb1);">Catálogo</p>
      <h1 style="font-family:Georgia,serif; font-size:2rem; color: var(--color-text,#f1ebe6); margin:0.25rem 0;">Beneficios disponibles</h1>
      <p>Canjeá tus puntos por descuentos, productos y experiencias exclusivas.</p>
    </div>

    <div class="filtros" id="filtros">
      <button class="filtro-btn active" data-tipo="">Todos</button>
      <button class="filtro-btn" data-tipo="descuento">Descuentos</button>
      <button class="filtro-btn" data-tipo="producto">Productos</button>
      <button class="filtro-btn" data-tipo="envio">Envíos</button>
      <button class="filtro-btn" data-tipo="experiencia">Experiencias</button>
    </div>

    <div class="beneficios-grid" id="beneficiosGrid">
      <div class="loading">Cargando beneficios...</div>
    </div>
  </main>

  <footer style="text-align:center; padding: 2rem; border-top: 1px solid var(--color-border,#2a2a2a);">
    <p style="font-size:0.8rem; color: var(--color-muted,#6a645f);">CLUB <em>JAZMÍN</em> DE ROSAS &nbsp;·&nbsp; club.jazminderosas.com</p>
  </footer>

  <script>
    const SUPABASE_URL = 'https://qgsdqzqvrbkprbmehzcf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_0RGb096UtD0AQYRtukuNwg_zmLf3nwF';

    const TIPO_LABEL = {
      descuento:   'Descuento',
      producto:    'Producto',
      envio:       'Envío gratis',
      experiencia: 'Experiencia',
    };

    let todos = [];
    let filtroActivo = '';

    async function cargarBeneficios() {
      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/beneficios?activo=eq.true&order=puntos_requeridos.asc&select=*`,
          { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
        );
        todos = await res.json();
        renderizar();
      } catch (e) {
        document.getElementById('beneficiosGrid').innerHTML =
          '<p style="color:#6a645f;text-align:center;padding:2rem;">No se pudieron cargar los beneficios. Intentá de nuevo más tarde.</p>';
      }
    }

    function renderizar() {
      const grid = document.getElementById('beneficiosGrid');
      const lista = filtroActivo ? todos.filter(b => b.tipo === filtroActivo) : todos;

      if (!lista.length) {
        grid.innerHTML = '<p style="color:#6a645f;text-align:center;padding:2rem;">Sin beneficios en esta categoría.</p>';
        return;
      }

      grid.innerHTML = lista.map(b => `
        <div class="beneficio-card">
          <div class="beneficio-tipo">${TIPO_LABEL[b.tipo] || b.tipo}</div>
          <div class="beneficio-nombre">${b.nombre}</div>
          <div class="beneficio-desc">${b.descripcion || ''}</div>
          <div class="beneficio-footer">
            <div class="beneficio-puntos">
              ${b.puntos_requeridos.toLocaleString('es-AR')}
              <span>puntos</span>
            </div>
            <button class="beneficio-btn" onclick="canjear('${b.id}', '${b.nombre.replace(/'/g, '')}', ${b.puntos_requeridos})">Canjear</button>
          </div>
        </div>
      `).join('');
    }

    function canjear(id, nombre, puntos) {
      alert(`Para canjear "${nombre}" (${puntos} puntos), presentá tu perfil del Club en el local o escribinos por WhatsApp.`);
    }

    document.getElementById('filtros').addEventListener('click', e => {
      const btn = e.target.closest('.filtro-btn');
      if (!btn) return;
      document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filtroActivo = btn.dataset.tipo;
      renderizar();
    });

    document.getElementById('menuToggle')?.addEventListener('click', () =>
      document.getElementById('siteNav')?.classList.add('open'));
    document.getElementById('menuClose')?.addEventListener('click', () =>
      document.getElementById('siteNav')?.classList.remove('open'));

    cargarBeneficios();
  </script>
</body>
</html>
