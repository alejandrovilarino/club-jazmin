<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beneficios — Club Jazmín</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    body { background: var(--grafito) !important; }
    .pag-beneficios {
      padding: 120px 40px 80px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .pag-eyebrow {
      font-family: var(--font-body);
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--rosa);
      margin-bottom: 12px;
    }
    .pag-title {
      font-family: var(--font-display);
      font-size: clamp(32px, 5vw, 52px);
      font-weight: 600;
      color: var(--tiza);
      margin-bottom: 8px;
      line-height: 1.1;
    }
    .pag-sub {
      font-size: 14px;
      font-weight: 300;
      color: var(--vison);
      margin-bottom: 40px;
    }
    .filtros {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }
    .filtro-btn {
      font-family: var(--font-body);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      background: transparent;
      border: 1px solid #3a3a3a;
      color: var(--vison);
      border-radius: 20px;
      padding: 8px 18px;
      cursor: pointer;
      transition: var(--transition);
    }
    .filtro-btn:hover,
    .filtro-btn.active {
      border-color: var(--rosa);
      color: var(--tiza);
      background: rgba(223,159,177,0.15);
    }
    .beneficios-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }
    .ben-card {
      background: #232323;
      border: 0.5px solid #3a3a3a;
      border-radius: 12px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: var(--transition);
    }
    .ben-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .ben-tipo {
      font-family: var(--font-body);
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--rosa);
      font-weight: 500;
    }
    .ben-nombre {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 600;
      color: var(--tiza);
      line-height: 1.2;
    }
    .ben-desc {
      font-size: 13px;
      font-weight: 300;
      color: var(--vison);
      line-height: 1.6;
      flex: 1;
    }
    .ben-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding-top: 16px;
      border-top: 0.5px solid #3a3a3a;
    }
    .ben-puntos-num {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 300;
      color: var(--tiza);
      line-height: 1;
    }
    .ben-puntos-label {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--vison);
      margin-top: 2px;
    }
    .loading-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 0;
      font-size: 13px;
      color: var(--vison);
      font-weight: 300;
    }
    @media (max-width: 768px) {
      .pag-beneficios { padding: 100px 20px 60px; }
      .beneficios-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="../index.html" class="nav-logo">CLUB <em>JAZMÍN</em> DE ROSAS</a>
    <ul class="nav-links">
      <li><a href="../index.html">Inicio</a></li>
      <li><a href="perfil.html">Mi perfil</a></li>
      <li><a href="beneficios.html">Beneficios</a></li>
      <li><a href="skinbook.html">Skinbook</a></li>
    </ul>
    <button class="nav-hamburger" id="hamburger" aria-label="Menú">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <div class="nav-mobile" id="navMobile">
    <button class="nav-mobile-close" id="navClose">&#10005;</button>
    <a href="../index.html">Inicio</a>
    <a href="perfil.html">Mi perfil</a>
    <a href="beneficios.html">Beneficios</a>
    <a href="skinbook.html">Skinbook</a>
  </div>

  <main class="pag-beneficios">
    <p class="pag-eyebrow">Catálogo</p>
    <h1 class="pag-title">Beneficios disponibles</h1>
    <p class="pag-sub">Canjeá tus puntos por descuentos, productos y experiencias exclusivas.</p>

    <div class="filtros" id="filtros">
      <button class="filtro-btn active" data-tipo="">Todos</button>
      <button class="filtro-btn" data-tipo="descuento">Descuentos</button>
      <button class="filtro-btn" data-tipo="producto">Productos</button>
      <button class="filtro-btn" data-tipo="envio">Envíos</button>
      <button class="filtro-btn" data-tipo="experiencia">Experiencias</button>
    </div>

    <div class="beneficios-grid" id="beneficiosGrid">
      <div class="loading-state">Cargando beneficios…</div>
    </div>
  </main>

  <footer>
    <p class="footer-logo">CLUB <em>JAZMÍN</em> DE ROSAS</p>
    <p class="footer-sub">club.jazminderosas.com</p>
  </footer>

  <script>
    const SUPABASE_URL = 'https://qgsdqzqvrbkprbmehzcf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_0RGb096UtD0AQYRtukuNwg_zmLf3nwF';

    const TIPO_LABEL = {
      descuento:   'Descuento',
      producto:    'Producto',
      envio:       'Envío gratis',
      experiencia: 'Experiencia',
    };

    let todos = [];
    let filtroActivo = '';

    async function cargarBeneficios() {
      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/beneficios?activo=eq.true&order=puntos_requeridos.asc&select=*`,
          { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
        );
        todos = await res.json();
        renderizar();
      } catch {
        document.getElementById('beneficiosGrid').innerHTML =
          '<div class="loading-state">No se pudieron cargar los beneficios. Intentá más tarde.</div>';
      }
    }

    function renderizar() {
      const grid = document.getElementById('beneficiosGrid');
      const lista = filtroActivo ? todos.filter(b => b.tipo === filtroActivo) : todos;
      if (!lista.length) {
        grid.innerHTML = '<div class="loading-state">Sin beneficios en esta categoría.</div>';
        return;
      }
      grid.innerHTML = lista.map(b => `
        <div class="ben-card">
          <div class="ben-tipo">${TIPO_LABEL[b.tipo] || b.tipo}</div>
          <div class="ben-nombre">${b.nombre}</div>
          <div class="ben-desc">${b.descripcion || ''}</div>
          <div class="ben-footer">
            <div>
              <div class="ben-puntos-num">${b.puntos_requeridos.toLocaleString('es-AR')}</div>
              <div class="ben-puntos-label">puntos</div>
            </div>
            <button class="btn btn-primary" onclick="canjear('${b.nombre.replace(/'/g,'')}',${b.puntos_requeridos})">
              Canjear
            </button>
          </div>
        </div>
      `).join('');
    }

    function canjear(nombre, puntos) {
      alert(`Para canjear "${nombre}" (${puntos} puntos), presentá tu perfil del Club en el local o escribinos por WhatsApp.`);
    }

    document.getElementById('filtros').addEventListener('click', e => {
      const btn = e.target.closest('.filtro-btn');
      if (!btn) return;
      document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filtroActivo = btn.dataset.tipo;
      renderizar();
    });

    document.getElementById('hamburger')?.addEventListener('click', () =>
      document.getElementById('navMobile').classList.add('open'));
    document.getElementById('navClose')?.addEventListener('click', () =>
      document.getElementById('navMobile').classList.remove('open'));

    cargarBeneficios();
  </script>
</body>
</html>
